name: Build Metevra Weather Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # PYTHON
      # ---------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------
      # JAVA
      # ---------------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # LINUX DEPENDENCIES
      # ---------------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libjpeg-dev \
            libpng-dev \
            gettext


      # ---------------------------------------------------------
      # ANDROID SDK
      # ---------------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;25.1.8937393"


      # ---------------------------------------------------------
      # VERIFY SDK
      # ---------------------------------------------------------

      - name: Verify Android SDK
        run: |
          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/25.1.8937393"

          echo "SDK OK"


      # ---------------------------------------------------------
      # VERIFY AIDL
      # ---------------------------------------------------------

      - name: Verify AIDL
        run: |
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --help >/dev/null

          echo "AIDL OK"


      # ---------------------------------------------------------
      # PYTHON PACKAGING TOOLS
      # ---------------------------------------------------------

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ---------------------------------------------------------
      # PYTHON-FOR-ANDROID
      # PINNED TO 2024.01.21
      # ---------------------------------------------------------

      - name: Clone pinned python-for-android
        run: |
          rm -rf "$GITHUB_WORKSPACE/python-for-android"

          git clone \
            --depth 1 \
            --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

          cd "$GITHUB_WORKSPACE/python-for-android"

          echo "======================================"
          echo "P4A COMMIT"
          echo "======================================"

          git rev-parse HEAD

          echo "======================================"
          echo "INSTALL P4A DEPENDENCIES"
          echo "======================================"

          python -m pip install \
            appdirs \
            colorama \
            "jinja2" \
            "sh>=1.10,<2.0" \
            build \
            toml \
            packaging \
            setuptools \
            wheel \
            six \
            requests

          echo "======================================"
          echo "P4A VERSION"
          echo "======================================"

          python -m pythonforandroid.toolchain --version


      # ---------------------------------------------------------
      # CHECK P4A PYTHON RECIPE
      # ---------------------------------------------------------

      - name: Verify Python 3.11 recipe
        run: |
          cd "$GITHUB_WORKSPACE/python-for-android"

          echo "======================================"
          echo "PYTHON RECIPE VERSION"
          echo "======================================"

          grep -n "version =" \
            pythonforandroid/recipes/python3/__init__.py \
            | head -5

          echo "======================================"
          echo "HOST PYTHON RECIPE VERSION"
          echo "======================================"

          grep -n "version =" \
            pythonforandroid/recipes/hostpython3/__init__.py \
            | head -5

          grep -q "version = '3.11.5'" \
            pythonforandroid/recipes/python3/__init__.py

          grep -q "version = '3.11.5'" \
            pythonforandroid/recipes/hostpython3/__init__.py

          echo "Python 3.11.5 recipe confirmed"


      # ---------------------------------------------------------
      # BUILD0ZER SPEC CHECK
      # ---------------------------------------------------------

      - name: Verify buildozer.spec
        run: |
          echo "======================================"
          echo "BUILDOZER SPEC"
          echo "======================================"

          cat buildozer.spec

          echo "======================================"
          echo "CHECKS"
          echo "======================================"

          grep -q \
            "requirements = python3,kivy==2.3.1,requests,pillow" \
            buildozer.spec

          grep -q \
            "android.archs = arm64-v8a" \
            buildozer.spec

          grep -q \
            "android.ndk = 25b" \
            buildozer.spec

          grep -q \
            "p4a.source_dir" \
            buildozer.spec

          echo "buildozer.spec OK"


      # ---------------------------------------------------------
      # PREPARE BUILDOZER DIRECTORIES
      # ---------------------------------------------------------

      - name: Prepare Buildozer Android directories
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf \
            "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_SDK_ROOT" \
            "$HOME/.buildozer/android/platform/android-sdk"


          rm -rf \
            "$HOME/.buildozer/android/platform/android-ndk-r25b"

          ln -s \
            "$ANDROID_SDK_ROOT/ndk/25.1.8937393" \
            "$HOME/.buildozer/android/platform/android-ndk-r25b"


          echo "======================================"
          echo "BUILDOZER PLATFORM"
          echo "======================================"

          ls -la \
            "$HOME/.buildozer/android/platform"


      # ---------------------------------------------------------
      # CLEAN BUILD
      # ---------------------------------------------------------

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # ---------------------------------------------------------
      # FORCE ENVIRONMENT
      # ---------------------------------------------------------

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"

          echo "P4A_PATH=$GITHUB_WORKSPACE/python-for-android" >> "$GITHUB_ENV"

          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"


      # ---------------------------------------------------------
      # VERIFY ENVIRONMENT
      # ---------------------------------------------------------

      - name: Verify final environment
        run: |
          echo "======================================"
          echo "FINAL ENVIRONMENT"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "P4A_PATH=$P4A_PATH"

          echo "======================================"
          echo "P4A LOCATION"
          echo "======================================"

          test -f "$P4A_PATH/pythonforandroid/toolchain.py"

          echo "P4A source OK"

          echo "======================================"
          echo "NDK"
          echo "======================================"

          test -f "$ANDROID_NDK_HOME/source.properties"

          cat "$ANDROID_NDK_HOME/source.properties"


      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------

      - name: Build Metevra Weather APK
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          echo "======================================"
          echo "START BUILD"
          echo "======================================"

          buildozer -v android debug


      # ---------------------------------------------------------
      # SHOW RESULT
      # ---------------------------------------------------------

      - name: Show build result
        if: always()
        run: |
          echo "======================================"
          echo "BIN FILES"
          echo "======================================"

          find bin \
            -maxdepth 2 \
            -type f \
            -print || true


          echo "======================================"
          echo "APK / AAB FILES"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print || true


      # ---------------------------------------------------------
      # UPLOAD
      # ---------------------------------------------------------

      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-Android
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
