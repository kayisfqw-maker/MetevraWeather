name: Build Metevra Weather Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: metevra_weather

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            rsync

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.37

      - name: Prepare pinned python-for-android
        run: |
          rm -rf "$GITHUB_WORKSPACE/python-for-android"

          git clone \
            --branch v2024.01.21 \
            --depth 1 \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

          echo "===== P4A VERSION ====="
          cd "$GITHUB_WORKSPACE/python-for-android"
          git describe --tags --always

          echo "===== PYTHON RECIPE ====="
          grep -n "version =" pythonforandroid/recipes/python3/__init__.py | head

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show generated APK
        if: always()
        run: |
          echo "===== BIN ====="
          ls -lah bin || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: metevra_weather/bin/*.apk
          if-no-files-found: error
