name: Metevra Weather Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y build-essential git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake rsync

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;37.0.0"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --help
          echo "ANDROID SDK OK"

      - name: Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.37
          python --version
          buildozer --version

      - name: Python for Android
        run: |
          rm -rf "$GITHUB_WORKSPACE/python-for-android"
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git "$GITHUB_WORKSPACE/python-for-android"
          echo "P4A:"
          git -C "$GITHUB_WORKSPACE/python-for-android" describe --tags --always
          echo "Python recipe:"
          grep "version =" "$GITHUB_WORKSPACE/python-for-android/pythonforandroid/recipes/python3/__init__.py" | head -1

      - name: Buildozer SDK fix
        working-directory: metevra_weather
        run: |
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"
          ln -s "$ANDROID_SDK_ROOT/platform-tools" "$HOME/.buildozer/android/platform/android-sdk/platform-tools"
          ln -s "$ANDROID_SDK_ROOT/platforms" "$HOME/.buildozer/android/platform/android-sdk/platforms"
          ln -s "$ANDROID_SDK_ROOT/build-tools" "$HOME/.buildozer/android/platform/android-sdk/build-tools"
          ln -s "$ANDROID_SDK_ROOT/cmdline-tools" "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools"
          printf '%s\n' '#!/bin/sh' 'exec "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "$@"' > "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          chmod +x "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version
          echo "SDKMANAGER OK"

      - name: P4A configuration
        working-directory: metevra_weather
        run: |
          sed -i '/^p4a.source_dir/d' buildozer.spec
          sed -i '/^\[buildozer\]/a p4a.source_dir = /home/runner/work/MetevraWeather/MetevraWeather/python-for-android' buildozer.spec
          echo "P4A SOURCE:"
          grep "p4a.source_dir" buildozer.spec
          echo "BUILD SPEC:"
          cat buildozer.spec

      - name: Build APK
        working-directory: metevra_weather
        run: |
          echo "===== METEVRA WEATHER ====="
          echo "Python:"
          python --version
          echo "Buildozer:"
          buildozer --version
          echo "P4A:"
          grep "p4a.source_dir" buildozer.spec
          echo "BUILD START"
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: find "$GITHUB_WORKSPACE" -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: metevra_weather/bin/*.apk
          if-no-files-found: error
