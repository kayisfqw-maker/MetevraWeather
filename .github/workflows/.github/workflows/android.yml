name: Build Metevra Weather Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            rsync

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl"

          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" \
            --help >/dev/null

          echo "ANDROID SDK OK"
          echo "AIDL OK"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37

          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version

      - name: Clone python-for-android
        run: |
          P4A="$GITHUB_WORKSPACE/python-for-android"

          rm -rf "$P4A"

          git clone \
            --depth 1 \
            --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$P4A"

          cd "$P4A"

          echo "P4A VERSION:"
          git describe --tags --always

          echo "PYTHON RECIPE:"
          grep "version =" \
            pythonforandroid/recipes/python3/__init__.py \
            | head -1

      - name: Prepare Buildozer SDK
        working-directory: metevra_weather
        run: |
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          SYSTEM_SDK="$ANDROID_SDK_ROOT"

          rm -rf "$BUILD_SDK"

          mkdir -p "$BUILD_SDK/tools/bin"

          for item in "$SYSTEM_SDK"/*; do
            name="$(basename "$item")"

            if [ "$name" != "tools" ]; then
              ln -s "$item" "$BUILD_SDK/$name"
            fi
          done

          cat > "$BUILD_SDK/tools/bin/sdkmanager" <<EOF
#!/bin/sh
exec "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SYSTEM_SDK" "\$@"
EOF

          chmod +x "$BUILD_SDK/tools/bin/sdkmanager"

          echo "SDKMANAGER:"
          "$BUILD_SDK/tools/bin/sdkmanager" --version

          echo "BUILD SDK READY"

      - name: Configure Buildozer
        working-directory: metevra_weather
        run: |
          P4A="$GITHUB_WORKSPACE/python-for-android"

          python - "$P4A" <<'PY'
from pathlib import Path
import sys

spec = Path("buildozer.spec")
p4a = sys.argv[1]

text = spec.read_text(encoding="utf-8")

lines = []

for line in text.splitlines():
    if not line.strip().startswith("p4a.source_dir"):
        lines.append(line)

text = "\n".join(lines).rstrip() + "\n"

if "[buildozer]" not in text:
    text += "\n[buildozer]\n"
    text += "log_level = 2\n"
    text += "warn_on_root = 1\n"

lines = text.splitlines()
output = []
inside_buildozer = False
inserted = False

for line in lines:
    stripped = line.strip()

    if stripped.startswith("[") and stripped.endswith("]"):
        inside_buildozer = stripped == "[buildozer]"

    output.append(line)

    if inside_buildozer and stripped == "warn_on_root = 1":
        output.append("p4a.source_dir = " + p4a)
        inserted = True

if not inserted:
    output = []
    for line in lines:
        output.append(line)

        if line.strip() == "[buildozer]":
            output.append("p4a.source_dir = " + p4a)
            inserted = True

spec.write_text(
    "\n".join(output).rstrip() + "\n",
    encoding="utf-8"
)
PY

          echo "================================"
          echo "BUILDOVER SPEC"
          echo "================================"

          cat buildozer.spec

      - name: Verify configuration
        working-directory: metevra_weather
        run: |
          echo "P4A SOURCE:"
          grep "^p4a.source_dir" buildozer.spec

          echo "P4A PYTHON:"
          grep "version =" \
            "$GITHUB_WORKSPACE/python-for-android/pythonforandroid/recipes/python3/__init__.py" \
            | head -1

          echo "AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" \
            --help >/dev/null

          echo "CONFIGURATION OK"

      - name: Build APK
        working-directory: metevra_weather
        run: |
          echo "================================"
          echo "METEVRA WEATHER BUILD"
          echo "================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "Starting Buildozer..."

          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "================================"
          echo "GENERATED APK / AAB"
          echo "================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: metevra_weather/bin/*.apk
          if-no-files-found: error
