name: Build Metevra Weather Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # PYTHON
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # LINUX DEPENDENCIES
      # =========================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libjpeg-dev \
            libpng-dev \
            gettext


      # =========================================================
      # ANDROID SDK
      # =========================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;25.1.8937393"


      # =========================================================
      # VERIFY SDK
      # =========================================================

      - name: Verify Android SDK
        run: |
          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/25.1.8937393"

          echo "ANDROID SDK OK"


      # =========================================================
      # VERIFY AIDL
      # =========================================================

      - name: Verify AIDL
        run: |
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --help >/dev/null

          echo "AIDL OK"


      # =========================================================
      # BUILDOZER
      # =========================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # =========================================================
      # PYTHON-FOR-ANDROID
      # =========================================================

      - name: Clone pinned python-for-android
        run: |
          rm -rf "$GITHUB_WORKSPACE/python-for-android"

          git clone \
            --depth 1 \
            --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

          cd "$GITHUB_WORKSPACE/python-for-android"

          python -m pip install \
            appdirs \
            colorama \
            jinja2 \
            "sh>=1.10,<2.0" \
            build \
            toml \
            packaging \
            setuptools \
            wheel \
            six \
            requests

          echo "======================================"
          echo "P4A VERSION"
          echo "======================================"

          python -m pythonforandroid.toolchain --version


      # =========================================================
      # VERIFY P4A PYTHON VERSION
      # =========================================================

      - name: Verify Python 3.11.5 recipe
        run: |
          cd "$GITHUB_WORKSPACE/python-for-android"

          echo "======================================"
          echo "P4A PYTHON RECIPE"
          echo "======================================"

          grep -n "version =" \
            pythonforandroid/recipes/python3/__init__.py \
            | head -5

          echo "======================================"
          echo "HOST PYTHON RECIPE"
          echo "======================================"

          grep -n "version =" \
            pythonforandroid/recipes/hostpython3/__init__.py \
            | head -5


      # =========================================================
      # PREPARE BUILDOZER SDK
      # =========================================================

      - name: Prepare Buildozer Android directories
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf \
            "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_SDK_ROOT" \
            "$HOME/.buildozer/android/platform/android-sdk"


          rm -rf \
            "$HOME/.buildozer/android/platform/android-ndk-r25b"

          ln -s \
            "$ANDROID_SDK_ROOT/ndk/25.1.8937393" \
            "$HOME/.buildozer/android/platform/android-ndk-r25b"


          echo "======================================"
          echo "BUILDOZER PLATFORM"
          echo "======================================"

          ls -la \
            "$HOME/.buildozer/android/platform"


      # =========================================================
      # CHECK PROJECT STRUCTURE
      # =========================================================

      - name: Check Metevra project
        working-directory: metevra_weather
        run: |
          echo "======================================"
          echo "METEVRA WEATHER PROJECT"
          echo "======================================"

          pwd

          echo ""
          echo "FILES:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "BUILDOZER SPEC:"
          test -f buildozer.spec

          cat buildozer.spec

          echo ""
          echo "PROJECT OK"


      # =========================================================
      # VERIFY BUILDOZER SPEC
      # =========================================================

      - name: Verify Buildozer configuration
        working-directory: metevra_weather
        run: |
          echo "======================================"
          echo "VERIFY BUILDOZER"
          echo "======================================"

          grep -q \
            "requirements = python3,kivy==2.3.1,requests,pillow" \
            buildozer.spec

          grep -q \
            "android.archs = arm64-v8a" \
            buildozer.spec

          grep -q \
            "android.ndk = 25b" \
            buildozer.spec

          grep -q \
            "p4a.source_dir" \
            buildozer.spec

          echo "buildozer.spec OK"


      # =========================================================
      # CLEAN OLD BUILD
      # =========================================================

      - name: Clean Buildozer
        working-directory: metevra_weather
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Buildozer cache cleaned."


      # =========================================================
      # CONFIGURE ENVIRONMENT
      # =========================================================

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> "$GITHUB_ENV"

          echo "P4A_PATH=$GITHUB_WORKSPACE/python-for-android" >> "$GITHUB_ENV"

          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> "$GITHUB_ENV"


      # =========================================================
      # FINAL ENVIRONMENT CHECK
      # =========================================================

      - name: Verify final environment
        run: |
          echo "======================================"
          echo "FINAL ENVIRONMENT"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "P4A_PATH=$P4A_PATH"

          echo ""
          echo "P4A FILE:"

          test -f \
            "$P4A_PATH/pythonforandroid/toolchain.py"

          echo "P4A source OK"


      # =========================================================
      # BUILD APK
      # =========================================================

      - name: Build Metevra Weather APK
        working-directory: metevra_weather
        env:
          P4A_SOURCE_DIR: /home/runner/work/MetevraWeather/MetevraWeather/python-for-android
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          echo "======================================"
          echo "BUILDING METEVRA WEATHER"
          echo "======================================"

          pwd

          echo ""
          echo "BUILDOZER SPEC:"
          grep -E \
            "^(title|package.name|package.domain|version|requirements|android.api|android.minapi|android.ndk|android.archs|p4a.source_dir)" \
            buildozer.spec

          echo ""
          echo "======================================"
          echo "START BUILDOZER"
          echo "======================================"

          buildozer -v android debug


      # =========================================================
      # SHOW RESULT
      # =========================================================

      - name: Show build result
        if: always()
        working-directory: metevra_weather
        run: |
          echo "======================================"
          echo "BIN DIRECTORY"
          echo "======================================"

          find bin \
            -maxdepth 2 \
            -type f \
            -print || true

          echo ""
          echo "======================================"
          echo "APK / AAB"
          echo "======================================"

          find . \
            -type f \
            \( \
              -name "*.apk" \
              -o \
              -name "*.aab" \
            \) \
            -print || true


      # =========================================================
      # UPLOAD APK
      # =========================================================

      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-Android
          path: |
            metevra_weather/bin/*.apk
            metevra_weather/bin/*.aab
          if-no-files-found: error
