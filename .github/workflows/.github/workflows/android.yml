name: Build Metevra Weather Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: metevra_weather

    steps:

      # ---------------------------------------------------------
      # 1. GitHub repository
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ---------------------------------------------------------
      # 3. Java
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 4. Linux dependencies
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            rsync


      # ---------------------------------------------------------
      # 5. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # 6. Accept Android licenses
      # ---------------------------------------------------------
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true


      # ---------------------------------------------------------
      # 7. Install required Android packages
      # ---------------------------------------------------------
      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

          echo ""
          echo "===== ANDROID SDK CHECK ====="

          echo "SDK ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Build tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools/37.0.0"

          echo ""
          echo "AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --help >/dev/null

          echo "AIDL OK"


      # ---------------------------------------------------------
      # 8. Make Buildozer use the same Android SDK
      # ---------------------------------------------------------
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$BUILD_SDK"

          ln -s \
            "$ANDROID_SDK_ROOT" \
            "$BUILD_SDK"

          echo ""
          echo "===== BUILDOZER SDK ====="

          ls -lah "$BUILD_SDK"

          echo ""
          echo "Build tools:"
          ls -lah "$BUILD_SDK/build-tools/37.0.0"

          echo ""
          echo "AIDL:"
          "$BUILD_SDK/build-tools/37.0.0/aidl" --help >/dev/null

          echo "AIDL OK"


      # ---------------------------------------------------------
      # 9. Install Buildozer
      # ---------------------------------------------------------
      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0

          python -m pip install \
            cython==0.29.37

          echo ""
          echo "===== BUILDOZER VERSION ====="

          buildozer --version

          echo ""
          echo "===== PYTHON VERSION ====="

          python --version


      # ---------------------------------------------------------
      # 10. Download PINNED python-for-android
      # ---------------------------------------------------------
      - name: Prepare python-for-android
        shell: bash
        run: |
          P4A_DIR="$GITHUB_WORKSPACE/python-for-android"

          rm -rf "$P4A_DIR"

          git clone \
            --branch v2024.01.21 \
            --depth 1 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"

          echo ""
          echo "===== P4A VERSION ====="

          cd "$P4A_DIR"

          git describe --tags --always

          echo ""
          echo "===== PYTHON RECIPE ====="

          grep -n "version =" \
            pythonforandroid/recipes/python3/__init__.py \
            | head -5

          echo ""
          echo "===== P4A LOCATION ====="

          pwd


      # ---------------------------------------------------------
      # 11. Verify Buildozer configuration
      # ---------------------------------------------------------
      - name: Verify configuration
        shell: bash
        run: |
          echo ""
          echo "===== BUILD DIRECTORY ====="
          pwd

          echo ""
          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

          echo ""
          echo "===== P4A DIRECTORY ====="
          ls -lah "$GITHUB_WORKSPACE/python-for-android"

          echo ""
          echo "===== P4A RECIPE ====="

          grep -n "version =" \
            "$GITHUB_WORKSPACE/python-for-android/pythonforandroid/recipes/python3/__init__.py" \
            | head -5


      # ---------------------------------------------------------
      # 12. Clean previous Buildozer files
      # ---------------------------------------------------------
      - name: Clean Buildozer
        shell: bash
        run: |
          rm -rf .buildozer

          echo "Buildozer cache cleaned."


      # ---------------------------------------------------------
      # 13. Build APK
      # ---------------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          buildozer -v android debug


      # ---------------------------------------------------------
      # 14. Show generated files
      # ---------------------------------------------------------
      - name: List generated files
        if: always()
        shell: bash
        run: |
          echo ""
          echo "===== BIN DIRECTORY ====="

          ls -lah bin || true

          echo ""
          echo "===== APK FILES ====="

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true


      # ---------------------------------------------------------
      # 15. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: metevra_weather/bin/*.apk
          if-no-files-found: error
