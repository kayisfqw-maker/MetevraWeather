name: Build Metevra Weather Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            rsync

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --help >/dev/null

          echo "ANDROID SDK OK"
          echo "AIDL OK"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.37

          python --version
          buildozer --version

      - name: Clone pinned python-for-android
        run: |
          rm -rf "$GITHUB_WORKSPACE/python-for-android"

          git clone \
            --branch v2024.01.21 \
            --depth 1 \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

          cd "$GITHUB_WORKSPACE/python-for-android"

          echo "P4A VERSION:"
          git describe --tags --always

          echo "PYTHON RECIPE:"
          grep "version =" \
            pythonforandroid/recipes/python3/__init__.py | head -1

      - name: Prepare Buildozer
        working-directory: metevra_weather
        run: |
          rm -rf .buildozer

          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          SYSTEM_SDK="$ANDROID_SDK_ROOT"

          rm -rf "$BUILD_SDK"
          mkdir -p "$BUILD_SDK/tools/bin"

          for item in "$SYSTEM_SDK"/*; do
            name="$(basename "$item")"

            if [ "$name" != "tools" ]; then
              ln -s "$item" "$BUILD_SDK/$name"
            fi
          done

          cat > "$BUILD_SDK/tools/bin/sdkmanager" <<EOF
#!/bin/sh
exec "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SYSTEM_SDK" "\$@"
EOF

          chmod +x "$BUILD_SDK/tools/bin/sdkmanager"

          echo "SDKMANAGER:"
          "$BUILD_SDK/tools/bin/sdkmanager" --version

          echo "BUILD SDK READY"

      - name: Configure pinned P4A
        working-directory: metevra_weather
        run: |
          if grep -q "^p4a.source_dir" buildozer.spec; then
            sed -i \
              "s|^p4a.source_dir.*|p4a.source_dir = $GITHUB_WORKSPACE/python-for-android|" \
              buildozer.spec
          else
            cat >> buildozer.spec <<EOF

          [buildozer]
          log_level = 2
          warn_on_root = 1
          p4a.source_dir = $GITHUB_WORKSPACE/python-for-android
          EOF
          fi

          echo "================================"
          echo "BUILDOZER SPEC"
          echo "================================"

          cat buildozer.spec

      - name: Build APK
        working-directory: metevra_weather
        run: |
          echo "================================"
          echo "METEVRA WEATHER BUILD"
          echo "================================"

          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "P4A:"
          grep "version =" \
            "$GITHUB_WORKSPACE/python-for-android/pythonforandroid/recipes/python3/__init__.py" \
            | head -1

          echo "Starting Buildozer..."

          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "================================"
          echo "APK / AAB FILES"
          echo "================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: metevra_weather/bin/*.apk
          if-no-files-found: error
