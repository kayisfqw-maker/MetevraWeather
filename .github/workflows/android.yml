name: Build Metevra Weather Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libjpeg-dev \
            libpng-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "ndk;25.1.8937393"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -f "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl"

          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --help >/dev/null

          echo "Android SDK OK"
          echo "AIDL OK"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.37

      - name: Clone pinned python-for-android
        run: |
          rm -rf "$GITHUB_WORKSPACE/python-for-android"

          git clone \
            --depth 1 \
            --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

          cd "$GITHUB_WORKSPACE/python-for-android"

          python -m pip install -r requirements.txt || true

          python -m pythonforandroid.toolchain --version

      - name: Prepare Buildozer Android directories
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"
          ln -s "$ANDROID_SDK_ROOT" \
            "$HOME/.buildozer/android/platform/android-sdk"

          rm -rf "$HOME/.buildozer/android/platform/android-ndk-r25b"

          mkdir -p "$HOME/.buildozer/android/platform"

          ln -s "$ANDROID_SDK_ROOT/ndk/25.1.8937393" \
            "$HOME/.buildozer/android/platform/android-ndk-r25b"

          echo "Buildozer Android platform:"
          ls -la "$HOME/.buildozer/android/platform"

      - name: Verify buildozer.spec
        run: |
          echo "===== buildozer.spec ====="
          cat buildozer.spec
          echo "=========================="

          grep -q \
            "python3==3.11.5" \
            buildozer.spec

          grep -q \
            "android.archs = arm64-v8a" \
            buildozer.spec

          grep -q \
            "android.ndk = 25b" \
            buildozer.spec

          echo "buildozer.spec OK"

      - name: Clean previous Buildozer data
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build APK
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          ANDROIDNDK: "$HOME/.buildozer/android/platform/android-ndk-r25b"
          ANDROID_NDK_HOME: "$HOME/.buildozer/android/platform/android-ndk-r25b"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"

          buildozer -v android debug

      - name: Show generated files
        if: always()
        run: |
          echo "===== BIN ====="
          find bin -maxdepth 2 -type f -print || true

          echo "===== AAB/APK ====="
          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
