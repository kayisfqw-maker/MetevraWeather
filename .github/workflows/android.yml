name: Build Metevra Weather Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON 3.12
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-8-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev


      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # ACCEPT ANDROID LICENSES
      # ==========================================
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "ndk;25.1.8937393"


      # ==========================================
      # VERIFY ANDROID SDK
      # ==========================================
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --version

          adb version

          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" --help >/dev/null

          echo "Android SDK OK"


      # ==========================================
      # INSTALL BUILDOZER
      # ==========================================
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0 \
            cython==0.29.37


      # ==========================================
      # INSTALL PYTHON-FOR-ANDROID
      # ==========================================
      - name: Install Python-for-Android
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          rm -rf python-for-android

          git clone --depth 1 \
            --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git \
            python-for-android

          python -m pip install \
            appdirs \
            colorama \
            jinja2 \
            "sh>=1.10,<2.0" \
            build \
            toml \
            packaging \
            setuptools \
            wheel \
            six \
            requests

          echo "P4A location:"
          ls -la "$GITHUB_WORKSPACE/python-for-android"

          test -f \
            "$GITHUB_WORKSPACE/python-for-android/pythonforandroid/recipes/python3/__init__.py"

          echo "Python-for-Android OK"

      # ==========================================
      # FIX BUILDOZER SDK MANAGER
      # ==========================================
      - name: Fix Buildozer SDK Manager
        run: |
          set -e

          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          SYSTEM_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$SYSTEM_SDK/cmdline-tools/16.0/bin/sdkmanager"

          echo "System SDK: $SYSTEM_SDK"
          echo "SDK Manager: $SDKMANAGER"

          test -x "$SDKMANAGER"

          rm -rf "$BUILD_SDK"
          mkdir -p "$BUILD_SDK/tools/bin"

          ln -s "$SYSTEM_SDK/platform-tools" "$BUILD_SDK/platform-tools"
          ln -s "$SYSTEM_SDK/platforms" "$BUILD_SDK/platforms"
          ln -s "$SYSTEM_SDK/build-tools" "$BUILD_SDK/build-tools"
          ln -s "$SYSTEM_SDK/ndk" "$BUILD_SDK/ndk"
          ln -s "$SYSTEM_SDK/cmdline-tools" "$BUILD_SDK/cmdline-tools"

          printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            '' \
            'SYSTEM_SDK="/usr/local/lib/android/sdk"' \
            'REAL_SDKMANAGER="$SYSTEM_SDK/cmdline-tools/16.0/bin/sdkmanager"' \
            '' \
            'ARGS=()' \
            '' \
            'for arg in "$@"; do' \
            '  case "$arg" in' \
            '    --sdk_root=*)' \
            '      ;;' \
            '    *)' \
            '      ARGS+=("$arg")' \
            '      ;;' \
            '  esac' \
            'done' \
            '' \
            'exec "$REAL_SDKMANAGER" --sdk_root="$SYSTEM_SDK" "${ARGS[@]}"' \
            > "$BUILD_SDK/tools/bin/sdkmanager"

          chmod +x "$BUILD_SDK/tools/bin/sdkmanager"

          echo "Testing Buildozer SDK manager:"
          "$BUILD_SDK/tools/bin/sdkmanager" --version

          echo "Buildozer SDK manager OK"


      # ==========================================
      # VERIFY P4A + PROJECT
      # ==========================================
      - name: Verify project
        run: |
          echo "======================================"
          echo "BUILDING METEVRA WEATHER"
          echo "======================================"

          pwd

          echo ""
          echo "P4A:"
          ls -la "$GITHUB_WORKSPACE/python-for-android"

          echo ""
          echo "PROJECT:"
          ls -la "$GITHUB_WORKSPACE/metevra_weather"

          echo ""
          echo "BUILDOZER SPEC:"
          cat "$GITHUB_WORKSPACE/metevra_weather/buildozer.spec"

          echo ""
          echo "======================================"


      # ==========================================
      # CLEAN BUILDOZER
      # ==========================================
      - name: Clean Buildozer
        working-directory: metevra_weather
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer

          echo "Buildozer cache cleaned"


      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build APK
        working-directory: metevra_weather
        env:
          ANDROIDSDK: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk

          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/25.1.8937393
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393

          P4A_SOURCE_DIR: /home/runner/work/MetevraWeather/MetevraWeather/python-for-android

          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

        run: |
          echo "======================================"
          echo "START BUILDOZER"
          echo "======================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Cython:"
          cython --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "P4A:"
          test -d "$P4A_SOURCE_DIR"
          echo "$P4A_SOURCE_DIR"

          echo ""
          echo "ANDROID NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "BUILD:"
          buildozer android debug


      # ==========================================
      # LIST OUTPUT
      # ==========================================
      - name: List build output
        if: always()
        working-directory: metevra_weather
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          ls -lah bin || true


      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: metevra_weather/bin/*.apk
          if-no-files-found: error


      # ==========================================
      # UPLOAD AAB IF GENERATED
      # ==========================================
      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-AAB
          path: metevra_weather/bin/*.aab
          if-no-files-found: ignore
