name: Build Metevra Weather Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: metevra_weather

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            rsync

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

      - name: Prepare Buildozer SDK compatibility
        run: |
          SYSTEM_SDK="$ANDROID_SDK_ROOT"
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "System SDK:"
          echo "$SYSTEM_SDK"

          echo "Buildozer SDK:"
          echo "$BUILD_SDK"

          mkdir -p "$HOME/.buildozer/android/platform"

          # Buildozer'ın eski sdkmanager yolunu kullanabilmesi için
          # kendi yazılabilir SDK klasörünü oluşturuyoruz.
          rm -rf "$BUILD_SDK"
          mkdir -p "$BUILD_SDK"

          # Android SDK'nın ana klasörlerini Buildozer klasörüne
          # sembolik bağlantı olarak ekle.
          for item in "$SYSTEM_SDK"/*; do
            name="$(basename "$item")"

            if [ "$name" != "tools" ]; then
              ln -s "$item" "$BUILD_SDK/$name"
            fi
          done

          # Buildozer eski command-line-tools yolunu arıyor.
          mkdir -p "$BUILD_SDK/tools/bin"

          # Sistem sdkmanager'ını çağıran yerel wrapper.
          cat > "$BUILD_SDK/tools/bin/sdkmanager" <<EOF
          #!/bin/sh
          exec "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SYSTEM_SDK" "\$@"
          EOF

          # Sadece bizim oluşturduğumuz wrapper'a çalıştırma izni ver.
          chmod +x "$BUILD_SDK/tools/bin/sdkmanager"

          echo "Buildozer sdkmanager:"
          "$BUILD_SDK/tools/bin/sdkmanager" --version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0
          python -m pip install cython==0.29.37

      - name: Show build environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== PYTHON ====="
          python --version

          echo "===== CYTHON ====="
          cython --version

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== SDKMANAGER ====="
          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: List generated files
        if: always()
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: metevra_weather/bin/*.apk
          if-no-files-found: error
