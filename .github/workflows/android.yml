name: Build Metevra Weather Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: metevra_weather

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. PYTHON 3.12
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =========================================================
      # 3. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 4. LINUX DEPENDENCIES
      # =========================================================
      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            rsync


      # =========================================================
      # 5. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # =========================================================
      # 6. ACCEPT ANDROID LICENSES
      # =========================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "======================================"
          echo "ANDROID SDK MANAGER"
          echo "======================================"

          echo "$SDKMANAGER"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true


      # =========================================================
      # 7. INSTALL ANDROID PACKAGES
      # =========================================================
      - name: Install Android packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          echo "Installing Android packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

          echo ""
          echo "======================================"
          echo "ANDROID SDK CHECK"
          echo "======================================"

          echo "SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "Build Tools:"
          ls -lah "$ANDROID_SDK_ROOT/build-tools/37.0.0"

          echo ""
          echo "AIDL:"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/aidl" \
            --help >/dev/null

          echo "AIDL OK"


      # =========================================================
      # 8. INSTALL BUILDOZER
      # =========================================================
      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            buildozer==1.6.0

          python -m pip install \
            cython==0.29.37

          echo ""
          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"

          buildozer --version

          echo ""
          echo "Python:"
          python --version


      # =========================================================
      # 9. PIN PYTHON-FOR-ANDROID
      # =========================================================
      - name: Prepare pinned python-for-android
        shell: bash
        run: |
          P4A_DIR="$GITHUB_WORKSPACE/python-for-android"

          rm -rf "$P4A_DIR"

          git clone \
            --branch v2024.01.21 \
            --depth 1 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"

          echo ""
          echo "======================================"
          echo "P4A VERSION"
          echo "======================================"

          cd "$P4A_DIR"

          git describe --tags --always

          echo ""
          echo "Python recipe:"

          grep -n "version =" \
            pythonforandroid/recipes/python3/__init__.py \
            | head -5

          echo ""
          echo "P4A location:"
          pwd


      # =========================================================
      # 10. CLEAN BUILDOZER
      # =========================================================
      - name: Clean Buildozer
        shell: bash
        run: |
          rm -rf .buildozer

          echo "Buildozer cache cleaned."


      # =========================================================
      # 11. PREPARE BUILDOZER SDK
      # =========================================================
      - name: Prepare Buildozer Android SDK
        shell: bash
        run: |
          BUILD_ROOT="$HOME/.buildozer/android/platform"
          BUILD_SDK="$BUILD_ROOT/android-sdk"
          SYSTEM_SDK="$ANDROID_SDK_ROOT"

          mkdir -p "$BUILD_ROOT"

          rm -rf "$BUILD_SDK"

          mkdir -p "$BUILD_SDK"

          echo ""
          echo "======================================"
          echo "LINKING ANDROID SDK"
          echo "======================================"

          for item in "$SYSTEM_SDK"/*; do
            name="$(basename "$item")"

            if [ "$name" != "tools" ]; then
              ln -s "$item" "$BUILD_SDK/$name"
            fi
          done

          # Old Buildozer expects this legacy path.
          mkdir -p "$BUILD_SDK/tools/bin"

          cat > "$BUILD_SDK/tools/bin/sdkmanager" <<EOF
#!/bin/sh
exec "$SYSTEM_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SYSTEM_SDK" "\$@"
EOF

          chmod +x "$BUILD_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer SDK:"
          ls -lah "$BUILD_SDK"

          echo ""
          echo "Build Tools:"
          ls -lah "$BUILD_SDK/build-tools/37.0.0"

          echo ""
          echo "SDK Manager:"
          "$BUILD_SDK/tools/bin/sdkmanager" --version


      # =========================================================
      # 12. CONFIGURE P4A ENVIRONMENT
      # =========================================================
      - name: Configure python-for-android
        shell: bash
        run: |
          P4A_DIR="$GITHUB_WORKSPACE/python-for-android"

          echo "======================================"
          echo "P4A CONFIGURATION"
          echo "======================================"

          echo "P4A_DIR=$P4A_DIR"

          cd "$P4A_DIR"

          git describe --tags --always

          echo ""
          echo "Python recipe:"

          grep -n "version =" \
            pythonforandroid/recipes/python3/__init__.py \
            | head -5

          echo ""
          echo "P4A ready."


      # =========================================================
      # 13. VERIFY BUILDOZER SPEC
      # =========================================================
      - name: Verify Buildozer configuration
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "BUILD DIRECTORY"
          echo "======================================"

          pwd

          echo ""
          echo "======================================"
          echo "BUILDOZER SPEC"
          echo "======================================"

          cat buildozer.spec

          echo ""
          echo "======================================"
          echo "P4A VERSION"
          echo "======================================"

          grep -n "version =" \
            "$GITHUB_WORKSPACE/python-for-android/pythonforandroid/recipes/python3/__init__.py" \
            | head -5


      # =========================================================
      # 14. BUILD APK
      # =========================================================
      - name: Build APK
        shell: bash
        env:
          P4A_SOURCE_DIR: /home/runner/work/MetevraWeather/MetevraWeather/python-for-android
        run: |
          echo ""
          echo "======================================"
          echo "STARTING METEVRA WEATHER BUILD"
          echo "======================================"

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "P4A:"
          grep -n "version =" \
            "$GITHUB_WORKSPACE/python-for-android/pythonforandroid/recipes/python3/__init__.py" \
            | head -5

          echo ""
          echo "Starting Buildozer..."

          buildozer -v android debug


      # =========================================================
      # 15. FIND APK / AAB
      # =========================================================
      - name: Find generated files
        if: always()
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "GENERATED FILES"
          echo "======================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true


      # =========================================================
      # 16. UPLOAD APK
      # =========================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Metevra-Weather-APK
          path: metevra_weather/bin/*.apk
          if-no-files-found: error
